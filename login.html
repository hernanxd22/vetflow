<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetFlow — Iniciar sesión</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    :root {
      --teal: #0f9d7e;
      --teal-dark: #0b7a64;
      --teal-light: #e0f5f0;
      --teal-mid: #1bbfa0;
      --navy: #0d3d4f;
      --cream: #f7f9f8;
      --white: #ffffff;
      --text: #1a2e35;
      --muted: #5a7a82;
      --error: #e53e3e;
    }
 
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
    }
 
    .page {
      display: grid;
      grid-template-columns: 420px 1fr;
      min-height: 100vh;
    }
 
    /* ── PANEL IZQUIERDO ── */
    .panel-left {
      background: linear-gradient(160deg, var(--navy) 0%, #1a6b5a 60%, var(--teal) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 40px;
      text-align: center;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
    }
 
    .panel-left::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 80%, rgba(27,191,160,0.25) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 20%, rgba(15,157,126,0.15) 0%, transparent 50%);
    }
 
    .panel-left > * { position: relative; }
 
    .brand-paw {
      font-size: 52px;
      margin-bottom: 20px;
      display: block;
      animation: float 3s ease-in-out infinite;
    }
 
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
 
    .brand-name {
      font-family: 'Syne', sans-serif;
      font-size: 3.2rem;
      font-weight: 800;
      color: white;
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 16px;
    }
 
    .brand-desc {
      color: rgba(255,255,255,0.65);
      font-size: 0.95rem;
      line-height: 1.75;
      font-weight: 300;
      max-width: 280px;
    }
 
    .no-account {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid rgba(255,255,255,0.12);
      width: 100%;
    }
 
    .no-account p {
      color: rgba(255,255,255,0.5);
      font-size: 0.88rem;
      margin-bottom: 12px;
    }
 
    .btn-register-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 11px 24px;
      border-radius: 100px;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
      backdrop-filter: blur(10px);
    }
 
    .btn-register-link:hover {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.35);
    }
 
    /* ── PANEL DERECHO ── */
    .panel-right {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 56px;
    }
 
    .form-wrap { max-width: 420px; width: 100%; }
 
    .form-header { margin-bottom: 40px; }
 
    .form-header h2 {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
 
    .form-header p {
      color: var(--muted);
      font-size: 0.92rem;
    }
 
    .form { display: flex; flex-direction: column; gap: 20px; }
 
    .field { display: flex; flex-direction: column; gap: 7px; }
 
    .field label {
      font-size: 0.83rem;
      font-weight: 500;
      color: var(--text);
    }
 
    .field input {
      padding: 13px 16px;
      border: 1.5px solid rgba(15,157,126,0.2);
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--white);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
 
    .field input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(15,157,126,0.1);
    }
 
    .field input.error { border-color: var(--error); }
 
    .field-error {
      font-size: 0.78rem;
      color: var(--error);
      display: none;
    }
    .field-error.visible { display: block; }
 
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 48px; width: 100%; }
    .toggle-pw {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }
    .toggle-pw:hover { color: var(--teal); }
 
    #alert-error {
      display: none;
      background: #fff5f5;
      border: 1px solid rgba(229,62,62,0.25);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 0.88rem;
      color: var(--error);
    }
    #alert-error.visible { display: block; }
 
    .btn-submit {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, var(--teal) 0%, var(--teal-mid) 100%);
      color: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      padding: 15px 28px;
      border-radius: 100px;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 8px 28px rgba(15,157,126,0.32);
      margin-top: 4px;
    }
 
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(15,157,126,0.42); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
 
    /* ── RESPONSIVE ── */
    @media (max-width: 820px) {
      .page { grid-template-columns: 1fr; }
      .panel-left { position: relative; height: auto; min-height: 200px; padding: 40px 24px; }
      .brand-name { font-size: 2.4rem; }
      .no-account { display: none; }
      .panel-right { padding: 40px 24px; }
      .form-wrap { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="page">
 
    <!-- Panel izquierdo -->
    <div class="panel-left">
      <span class="brand-paw">🐾</span>
      <div class="brand-name">VetFlow</div>
      <p class="brand-desc">Bienvenido de vuelta. Gestioná los turnos de tus mascotas desde un solo lugar.</p>
      <div class="no-account">
        <p>¿No tenés cuenta?</p>
        <a href="/registro.html" class="btn-register-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Crear cuenta
        </a>
      </div>
    </div>
 
    <!-- Panel derecho -->
    <div class="panel-right">
      <div class="form-wrap">
 
        <div class="form-header">
          <h2>Iniciar sesión</h2>
          <p>Ingresá con tu usuario y contraseña</p>
        </div>
 
        <form class="form" id="form-login" novalidate>
 
          <div class="field">
            <label for="username">Nombre de usuario</label>
            <input type="text" id="username" placeholder="juanperez123" autocomplete="username">
            <span class="field-error" id="err-username">Ingresá tu usuario</span>
          </div>
 
          <div class="field">
            <label for="password">Contraseña</label>
            <div class="password-wrap">
              <input type="password" id="password" placeholder="Tu contraseña" autocomplete="current-password">
              <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Ver contraseña">
                <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <span class="field-error" id="err-password">Ingresá tu contraseña</span>
          </div>
 
          <div id="alert-error"></div>
 
          <button type="submit" class="btn-submit" id="btn-submit">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <polyline points="10 17 15 12 10 7"/>
              <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
            Entrar
          </button>
 
        </form>
      </div>
    </div>
 
  </div>
 
  <script>
    // Toggle contraseña
    const toggleBtn = document.getElementById('toggle-pw');
    const pwInput = document.getElementById('password');
    toggleBtn.addEventListener('click', () => {
      const isText = pwInput.type === 'text';
      pwInput.type = isText ? 'password' : 'text';
      document.getElementById('eye-icon').innerHTML = isText
        ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
        : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    });
 
    // Submit
    const form = document.getElementById('form-login');
    const alertError = document.getElementById('alert-error');
    const btn = document.getElementById('btn-submit');
 
    function setError(id, show) {
      document.getElementById('err-' + id)?.classList.toggle('visible', show);
      document.getElementById(id)?.classList.toggle('error', show);
    }
 
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertError.classList.remove('visible');
 
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
 
      let ok = true;
      setError('username', !username); if (!username) ok = false;
      setError('password', !password); if (!password) ok = false;
      if (!ok) return;
 
      btn.disabled = true;
      btn.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>
        Entrando...
      `;
 
      try {
        const res = await fetch('https://proyec1-server.bxyea0.easypanel.host/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error al iniciar sesión');
 
        // Guardar datos en sessionStorage y redirigir al dashboard
        sessionStorage.setItem('cliente_id', data.cliente_id);
        sessionStorage.setItem('nombre', data.nombre);
        sessionStorage.setItem('dni', data.dni);
        sessionStorage.setItem('apellido', data.apellido);
        
        window.location.href = '/index.html';
 
      } catch (err) {
        alertError.textContent = err.message;
        alertError.classList.add('visible');
        btn.disabled = false;
        btn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Entrar
        `;
      }
    });
  </script>
</body>
</html>
